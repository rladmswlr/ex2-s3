# 워크플로우(작업) 이름
name: GitOps CI Pipeline

on:
  push:
    branches:
      - main

jobs:
  build-and-update:
    runs-on: ubuntu-latest

    steps:
      - name: 소스코드 전송
        uses: actions/checkout@v4

      - name: AWS 자격 증명 설정
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ secrets.S3_REGION }}

      - name: S3에 소스 업로드
        run: |
          aws s3 sync html/ s3://std16-test-bucket/ --delete

      - name: Private EC2에 SSM 배포
        run: |
          COMMAND_ID=$(aws ssm send-command \
            --instance-ids "i-022eea274191f4ee7" \
            --document-name "AWS-RunShellScript" \
            --parameters 'commands=[
              "aws s3 sync s3://std16-test-bucket/ /usr/share/nginx/html/ --delete",
              "chown -R ec2-user:nginx /usr/share/nginx/html",
              "systemctl reload nginx"
            ]' \
            --region "${{ secrets.S3_REGION }}" \
            --comment "Deploying via SSM" \
            --query "Command.CommandId" \
            --output text)

          echo "SSM Command ID: $COMMAND_ID"

          aws ssm wait command-executed \
            --command-id "$COMMAND_ID" \
            --instance-id "i-022eea274191f4ee7" \
            --region "${{ secrets.S3_REGION }}"

          aws ssm get-command-invocation \
            --command-id "$COMMAND_ID" \
            --instance-id "i-022eea274191f4ee7" \
            --region "${{ secrets.S3_REGION }}"
